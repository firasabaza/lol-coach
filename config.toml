# Réglages du coach. Modifie, sauvegarde, relance.

# coach      : le constat + le conseil  (« 1300 gold. Crash la vague canon et back. »)
# faits      : le constat seul          (« 1300 gold. »)
# silencieux : ne dit rien, enregistre la partie et produit le débrief
niveau = "coach"

[voix]
active = false           # coupée au lancement ; en partie, la touche ci-dessous la met et la coupe
touche = "ctrl+m"
nom = "Microsoft Julie"  # autres voix FR installées : Microsoft Hortense, Microsoft Paul
hauteur = 1.15           # 1.0 = voix telle quelle ; plus haut = plus aiguë (1.1 à 1.25 reste naturel)
debit = 2                # -10 (lent) à 10 (rapide)
volume = 65              # 0 à 100
peremption = 8           # un conseil qui attend plus longtemps que ça (en secondes) est abandonné
# Conseils coupés à la voix : ils restent affichés en bulle.
dire_pinks = false       # le rappel de pink n'est plus dit
dire_back_des = 2000     # les conseils de back sur l'or ne sont dits qu'à partir de ce montant

# La voix française lit les mots anglais à la française. Écris ici comment elle doit les dire ;
# ajuste à l'oreille, ajoute les mots qui sonnent mal.
[voix.prononciation]
ward = "ouarde"
warder = "ouardé"
trade = "tréde"
trades = "tréde"
dive = "daïve"

# Messagerie en jeu : des bulles qui apparaissent puis s'effacent. Rien ne reste à l'écran, sauf
# les minuteurs de sorts que tu as lancés toi-même.
[fenetre]
active = true            # le jeu doit être en « fenêtré sans bordure » pour qu'elle passe au-dessus
coin = "haut-gauche"     # haut-gauche, haut-droite, bas-gauche, bas-droite
marge = 24
opacite = 0.92           # fond des bulles : 1 = opaque
duree = 9                # secondes d'affichage d'une bulle ; elle part plus tôt si tu suis le conseil

# Minuteurs des sorts d'invocateur ennemis. Le coach ne voit pas tes pings : quand tu vois partir
# un sort, appuie sur la touche de cet ennemi, en plus de ton ping. Deux appuis en moins de
# 10 secondes annulent. Ces touches ne sont prises à Windows que pendant une partie.
[sorts]
actif = true
# Une touche par ennemi, dans l'ordre du tableau des scores : top, jungle, mid, ADC, support.
flash = ["ctrl+f1", "ctrl+f2", "ctrl+f3", "ctrl+f4", "ctrl+f5"]
autre = ["shift+f1", "shift+f2", "shift+f3", "shift+f4", "shift+f5"]   # son autre sort

# « Où aller ? » : en partie, cette touche te donne l'endroit où être maintenant (lane, objectif, back).
# Si ce n'est pas jouable (un allié farme déjà la vague, un ennemi la tient), appuie encore dans les
# 25 secondes : le coach propose la solution suivante.
[carte]
touche = "ctrl+f6"

[seuils]
or_recall = 1300         # de quoi acheter un gros composant
or_dormant = 2000        # trop d'or non dépensé
or_reset_objectif = 900  # assez pour justifier un reset avant un objectif
pv_bas = 0.35
pv_critique = 0.20
vision_silence = 150     # secondes sans poser de vision avant un rappel
jungler_inconnu = 75     # secondes sans nouvelle du jungler adverse
cs_par_minute = 7.0      # objectif de farm
ecart_items = 700        # écart d'or en items avec l'ADC adverse qui mérite une annonce
annonces_objectif = [60, 30]   # secondes avant un objectif
