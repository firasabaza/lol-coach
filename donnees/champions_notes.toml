# Ce que les données de classe (donnees/champions.json) ne disent pas.
# Listes tenues à la main, à compléter au fil des parties. Les noms sont les noms internes
# du jeu : Kaisa, MissFortune, KogMaw, JarvanIV, MonkeyKing (Wukong), DrMundo...

# Soignent beaucoup, eux-mêmes ou leurs alliés : l'anti-soin est rentable.
